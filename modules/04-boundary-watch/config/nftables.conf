#!/usr/sbin/nft -f
# Zone based boundary firewall. Three zones: inside (10.10.10.0/24, trusted),
# outside (203.0.113.0/24, untrusted), mgmt (172.31.0.0/24, the collector).
# Default drop on forward, stateful allow for established return traffic,
# explicit service exposure, and logged denies for the monitoring plane.
flush ruleset

table inet boundary {
    chain inbound {
        # traffic terminating on the firewall itself
        type filter hook input priority 0; policy drop;
        ct state established,related accept
        iif "lo" accept
        icmp type echo-request accept
        # syslog and netflow are sourced by the firewall, not received here
        ip saddr 172.31.0.0/24 tcp dport 22 accept
        counter comment "dropped input"
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # stateful: return traffic for anything we already allowed
        ct state established,related accept
        ct state invalid log group 1 prefix "FW-INVALID: " drop

        # inside may reach anywhere outbound
        iifname "eth1" oifname { "eth2", "eth3" } accept

        # outside may reach ONLY the published web service on the inside host
        iifname "eth2" oifname "eth1" ip daddr 10.10.10.100 tcp dport 80 accept

        # collector zone talks to inside for management, not the reverse
        iifname "eth3" oifname "eth1" accept

        # everything else from outside is logged (via NFLOG group 1, which
        # ulogd bridges to syslog) and dropped
        iifname "eth2" log group 1 prefix "FW-DENY-OUTSIDE: " counter drop
        log group 1 prefix "FW-DENY-DEFAULT: " counter drop
    }

    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        # NAT inside hosts to the firewall's outside address when they leave
        oifname "eth2" ip saddr 10.10.10.0/24 snat to 203.0.113.1
    }
}
