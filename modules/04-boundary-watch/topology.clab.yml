# Module 4: boundary-watch
# An nftables firewall routing between an inside segment and an outside
# segment, with a monitoring plane: the firewall exports NetFlow (softflowd)
# and sends syslog to a collector that also runs nfcapd. The outside host
# plays attacker and legitimate client; the inside host runs a web service.
name: bastion-boundary

topology:
  nodes:
    fw:
      kind: linux
      image: bastion/monitor:lab
      binds:
        - config/nftables.conf:/etc/nftables.conf:ro
        - config/ulogd.conf:/etc/ulogd.conf:ro
        - config/fw-start.sh:/fw-start.sh:ro
      exec:
        - ip addr add 10.10.10.1/24 dev eth1
        - ip addr add 203.0.113.1/24 dev eth2
        - ip addr add 172.31.0.1/24 dev eth3
        - sysctl -w net.ipv4.ip_forward=1
        - bash /fw-start.sh

    inside:
      kind: linux
      image: bastion/monitor:lab
      exec:
        - ip addr add 10.10.10.100/24 dev eth1
        - ip route replace default via 10.10.10.1
        - ip route add 172.31.0.0/24 via 10.10.10.1
        # setsid detaches the server so the exec returns and deploy continues
        - bash -c "setsid python3 -m http.server 80 --bind 0.0.0.0 >/tmp/http.log 2>&1 < /dev/null &"

    outside:
      kind: linux
      image: bastion/monitor:lab
      exec:
        - ip addr add 203.0.113.100/24 dev eth1
        - ip route replace default via 203.0.113.1

    collector:
      kind: linux
      image: bastion/monitor:lab
      binds:
        - config/rsyslog-collector.conf:/etc/rsyslog.d/50-lab.conf:ro
        - config/collector-start.sh:/collector-start.sh:ro
      exec:
        - ip addr add 172.31.0.50/24 dev eth1
        - ip route add 203.0.113.0/24 via 172.31.0.1
        - ip route add 10.10.10.0/24 via 172.31.0.1
        - bash /collector-start.sh

  links:
    - endpoints: ["fw:eth1", "inside:eth1"]
    - endpoints: ["fw:eth2", "outside:eth1"]
    - endpoints: ["fw:eth3", "collector:eth1"]
