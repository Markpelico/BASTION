global
    log stdout local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    default-server inter 1s fall 2 rise 2

# L7 (HTTP) front end on the VIP: round robin across the two backends, with
# active health checks. fall 2 = mark down after 2 failed checks (2s here);
# rise 2 = mark up after 2 good checks.
frontend http_vip
    bind 10.20.0.10:80
    default_backend web_pool

backend web_pool
    balance roundrobin
    option httpchk GET /id
    server web1 10.20.0.101:8080 check
    server web2 10.20.0.102:8080 check

# L4 (TCP) front end on the same VIP, different port: no HTTP awareness, just
# connection level distribution. Contrast with the L7 front end above.
frontend tcp_vip
    mode tcp
    bind 10.20.0.10:8404
    default_backend web_pool_l4

backend web_pool_l4
    mode tcp
    balance roundrobin
    server web1 10.20.0.101:8080 check
    server web2 10.20.0.102:8080 check

# runtime stats page for inspection during drills
frontend stats
    bind 10.20.0.10:8405
    stats enable
    stats uri /stats
    stats refresh 2s
