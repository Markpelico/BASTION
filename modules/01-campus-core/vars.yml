# Config generation variables for module 1: campus-core.
# tools/generate.py renders these through templates/frr/*.j2 into configs/<node>/.
#
# Addressing plan:
#   LAN1 (VRRP segment)  10.10.0.0/24   VIP 10.10.0.1, r1 .11, r2 .12, h1 .100
#   r1 r3 link           10.0.13.0/30   area 0, cost 10 (preferred transit)
#   r2 r3 link           10.0.23.0/30   area 0, cost 50 (backup transit)
#   r3 r4 link           10.1.34.0/30   area 1
#   LAN2 (h2 segment)    10.40.0.0/24   r4 .1, h2 .100
#   loopbacks            10.255.0.0/24

lab: campus

nodes:
  r1:
    role: router
    router_id: 10.255.0.1
    loopback: 10.255.0.1/32
    daemons: [ospfd, vrrpd]
    ospf: {}
    interfaces:
      - name: eth1
        ip: 10.10.0.11/24
        ospf: {area: 0.0.0.0}
        vrrp: {vrid: 10, priority: 200, vip: 10.10.0.1}
      - name: eth2
        ip: 10.0.13.1/30
        ospf: {area: 0.0.0.0, ptp: true, cost: 10}

  r2:
    role: router
    router_id: 10.255.0.2
    loopback: 10.255.0.2/32
    daemons: [ospfd, vrrpd]
    ospf: {}
    interfaces:
      - name: eth1
        ip: 10.10.0.12/24
        ospf: {area: 0.0.0.0}
        vrrp: {vrid: 10, priority: 100, vip: 10.10.0.1}
      - name: eth2
        ip: 10.0.23.1/30
        ospf: {area: 0.0.0.0, ptp: true, cost: 50}

  r3:
    role: router
    router_id: 10.255.0.3
    loopback: 10.255.0.3/32
    daemons: [ospfd]
    ospf: {}
    interfaces:
      - name: eth1
        ip: 10.0.13.2/30
        ospf: {area: 0.0.0.0, ptp: true, cost: 10}
      - name: eth2
        ip: 10.0.23.2/30
        ospf: {area: 0.0.0.0, ptp: true, cost: 50}
      - name: eth3
        ip: 10.1.34.1/30
        ospf: {area: 0.0.0.1, ptp: true}

  r4:
    role: router
    router_id: 10.255.0.4
    loopback: 10.255.0.4/32
    daemons: [ospfd]
    ospf: {loopback_area: 0.0.0.1}
    interfaces:
      - name: eth1
        ip: 10.1.34.2/30
        ospf: {area: 0.0.0.1, ptp: true}
      - name: eth2
        ip: 10.40.0.1/24
        ospf: {area: 0.0.0.1, passive: true}

  h1:
    role: host
  h2:
    role: host
